[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Both supported R8 variants use 8 MB OPI PSRAM.
board_build.arduino.memory_type = qio_opi

build_flags =
  -DBOARD_HAS_PSRAM
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MOSI=11
  -DTFT_MISO=-1
  -DTFT_SCLK=12
  ; User's 7-pin ST7789 module has no CS pin.
  -DTFT_CS=-1
  -DTFT_DC=9
  -DTFT_RST=14
  ; BLK goes to 3V3 only if the module has onboard current limiting.
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1

lib_deps =
  bodmer/TFT_eSPI
  bblanchon/ArduinoJson@^6.21.5
  gilmaimon/ArduinoWebsockets@^0.5.4
  https://github.com/Bodmer/U8g2_for_TFT_eSPI.git

; Choose this environment for a module marked N16R8 (default).
[env:esp32-s3-devkitc-1]
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Choose this environment only for a module marked N8R8.
[env:esp32-s3-n8r8]
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
