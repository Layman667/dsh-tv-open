<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>大肥鱼 · 聊天</title>
  <link rel="stylesheet" href="/chat.css">
  <script type="module" src="/chat.js"></script>
</head>
<body>
  <main class="room">
    <header>
      <div class="portrait"><img src="/character.png" alt=""></div>
      <div><h1>大肥鱼</h1><p id="connection" role="status">连接中</p></div>
    </header>
    <form id="login" hidden>
      <label for="password">局域网访问码</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary">进入聊天</button>
      <p id="login-note" role="status"></p>
    </form>
    <section id="chat" aria-label="聊天" hidden>
      <div class="timeline" id="timeline" tabindex="0" aria-label="聊天记录">
        <button type="button" id="older" class="subtle" hidden>加载更早的消息</button>
        <p id="empty">发条消息，和大肥鱼打个招呼。</p>
        <div id="messages" role="log" aria-live="polite"></div>
      </div>
      <form id="composer">
        <div id="draft" class="draft" hidden>
          <span id="draft-label"></span>
          <button id="remove" type="button" class="subtle">移除</button>
        </div>
        <textarea id="text" rows="2" maxlength="12000" placeholder="给大肥鱼发消息…" aria-label="消息"></textarea>
        <div class="actions">
          <label class="subtle picker">图片<input type="file" id="image" accept="image/png,image/jpeg,image/gif,image/webp"></label>
          <button id="record" type="button" class="subtle" hidden>录音</button>
          <span id="notice" role="status"></span>
          <button type="submit" id="send" class="primary">发送</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
